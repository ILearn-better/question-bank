<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾课 · 独立教师工作台</title>
<link rel="stylesheet" href="/app.css">
<!--
  无构建的模块化方案：用 import map 把裸模块名映射到本地 vendor 文件，
  这样可以直接写 ES 模块、用真路由，而不需要 npm install 与打包。
  目标是「双击就能跑起来」——对一个自用工具，少一层构建就少一堆故障点。

  为什么用本地文件而不是 CDN：一是离线也能跑；二是 vue-router 的浏览器构建
  会 import '@vue/devtools-api'，映射到 vendor/devtools-api-stub.js 空实现，
  否则浏览器解析不了这个裸模块名，整个应用直接白屏（真实踩过的坑）。
  需要迁到 Vite 时，把 import map 换成 package.json 依赖即可，业务代码不用改。
-->
<script type="importmap">
{
  "imports": {
    "vue": "/vendor/vue.esm-browser.prod.js",
    "vue-router": "/vendor/vue-router.esm-browser.js",
    "@vue/devtools-api": "/vendor/devtools-api-stub.js"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
