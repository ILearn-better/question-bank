<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>debug</title>
<script type="importmap">
{
  "imports": {
    "vue": "/vendor/vue.esm-browser.prod.js",
    "vue-router": "/vendor/vue-router.esm-browser.js",
    "@vue/devtools-api": "/vendor/devtools-api-stub.js"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<pre id="out">booting...</pre>
<script>
window.__errs = [];
window.addEventListener('error', function(e){
  window.__errs.push('ERROR: ' + e.message + '  @ ' + (e.filename||'') + ':' + e.lineno + ':' + e.colno);
});
window.addEventListener('unhandledrejection', function(e){
  var r = e.reason;
  window.__errs.push('REJECTION: ' + ((r && (r.stack || r.message)) || String(r)));
});
function flush(){
  var el = document.getElementById('out');
  el.textContent = '--- ERRORS (' + window.__errs.length + ') ---\n' + window.__errs.join('\n---\n')
    + '\n--- APP HTML ---\n' + (document.getElementById('app').innerHTML || '(empty)').slice(0, 600);
}
setTimeout(flush, 1500);
setTimeout(flush, 5000);
setTimeout(flush, 9000);
</script>
<script type="module">
try {
  await import('/src/main.js');
  window.__errs.push('main.js imported OK');
} catch(e) {
  window.__errs.push('IMPORT FAILED: ' + ((e && (e.stack || e.message)) || String(e)));
}
</script>
</body>
</html>
