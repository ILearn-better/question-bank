# Alembic configuration (shike)
#
# NOTE: keep this file ASCII-only. Alembic reads it with the system locale
# encoding (GBK on zh-CN Windows), so non-ASCII comments break startup.
# The database URL is set in alembic/env.py from app/config.py, so changing
# the data directory only requires an environment variable change.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
